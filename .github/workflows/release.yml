name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release Tatpar
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tatpar application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tatpar ${{ github.ref_name }}"
          releaseBody: |
            See the assets below to download **Tatpar ${{ github.ref_name }}** for Windows and macOS.

            ### 🚀 What's New in ${{ github.ref_name }}:
            - 🪟 **Resizable Terminal**: Vertically drag the terminal pane to any custom height; double-click to collapse/restore.
            - 🔍 **Font Zooming**: `Ctrl + MouseWheel` zooms font in/out dynamically; `Ctrl + 0` resets to default.
            - 🎯 **Header Navigation**: Click the "Tatpar" brand in the header anytime to instantly return to and focus the code editor.
            - ⚡ **TypeScript Production Fix**: Fixed production runner failure and non-interactive npx hanging (closes #5).
            - 🛑 **Subprocess Deadlock Fix**: Asynchronous pipe streaming prevents freezes on large outputs >64KB (closes #18).
            - ☕ **Java LeetCode / Arbitrary Class Support**: Dynamically detects class names (e.g. `public class Solution`) without compilation errors (closes #20).
            - 🐍 **Python Real-Time Output**: Passed `-u` flag for immediate unbuffered stdout prints (closes #23).
            - ⌨️ **Language Indentation**: 2 spaces for JavaScript/TypeScript, 4 spaces for Python/Java/Kotlin/C++ (closes #26).
            - 📜 **Terminal Auto-Scroll**: Output automatically scrolls to the bottom on new execution runs (closes #27).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
